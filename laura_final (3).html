<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Laura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Dancing+Script:wght@600;700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#170b10;
    --bg-2:#2b1420;
    --cream:#f7ece2;
    --gold:#d9a35f;
    --stem:#3f5c43;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 15%, var(--bg-2) 0%, var(--bg-1) 65%);
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--cream);
  }
  #stage.hidden-for-intro{ opacity:0; }
  #stage{
    transition: opacity 1.8s ease;
  }

  #intro{
    position:fixed; inset:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    padding:0 10vw;
    text-align:center;
    z-index:100;
    opacity:1;
    transition:opacity 1.6s ease;
  }
  #intro.fade-out{ opacity:0; pointer-events:none; }
  #intro p{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.15rem, 5.2vw, 1.6rem);
    color:rgba(247,236,226,0.9);
    line-height:1.6;
    opacity:0;
    letter-spacing:0.01em;
  }
  #intro p.in{
    animation: introFade 3.4s ease forwards;
  }
  @keyframes introFade{
    0%{ opacity:0; transform:translateY(6px); }
    18%{ opacity:1; transform:translateY(0); }
    78%{ opacity:1; transform:translateY(0); }
    100%{ opacity:0; transform:translateY(-6px); }
  }

  #bigMoment{
    position:fixed; inset:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    padding:0 10vw;
    text-align:center;
    z-index:90;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.4s ease;
  }
  #bigMoment.show{ opacity:1; pointer-events:auto; }
  #bigMoment.fade-out{ opacity:0; }
  #bigMoment p{
    font-family:'Dancing Script', cursive;
    font-size:clamp(1.9rem, 8vw, 2.8rem);
    color:var(--cream);
    text-shadow:0 0 20px rgba(217,163,95,0.4);
    line-height:1.5;
    margin:0;
    min-height:1.4em;
  }
  #bigMoment .cursor{
    display:inline-block;
    width:2px;
    margin-left:2px;
    color:var(--gold);
    animation:blink 0.9s step-start infinite;
  }
  @keyframes blink{
    50%{ opacity:0; }
  }

  #stage{
    position:relative;
    z-index:1;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:6vh;
  }
  .sparkle{
    position:absolute;
    border-radius:50%;
    background:var(--gold);
    opacity:0.35;
    animation:tw 4s ease-in-out infinite;
  }
  @keyframes tw{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.6; transform:scale(1.4);}
  }

  .starfield{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
  }
  .star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation-name:starTwinkle;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  @keyframes starTwinkle{
    0%,100%{ opacity:var(--minO, 0.12); }
    50%{ opacity:var(--maxO, 0.5); }
  }

  .stage-floater{
    position:absolute;
    top:0; left:0;
    opacity:0.55;
    filter:drop-shadow(0 0 6px rgba(217,163,95,0.25));
    animation-name:qFloat;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .stage-floater svg{ width:100%; height:100%; display:block; }

  #stageAmbient{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
  }

  h1.title{
    font-family:'Dancing Script', cursive;
    font-size:clamp(2.2rem, 9vw, 3rem);
    margin:0 0 2px 0;
    color:var(--cream);
    text-shadow:0 0 18px rgba(217,163,95,0.35);
    transition:opacity 1.6s ease;
  }
  h1.title.fade-out{ opacity:0; }
  p.sub{
    margin:0 0 4vh 0;
    font-weight:300;
    letter-spacing:0.03em;
    color:rgba(247,236,226,0.75);
    font-size:0.95rem;
    text-align:center;
    padding:0 8vw;
    min-height:1.4em;
    transition:opacity .4s ease;
  }

  #garden{
    --flowerSize: min(78vw, 320px);
    position:relative;
    width:var(--flowerSize);
    height:calc(var(--flowerSize) + 92px);
    filter:drop-shadow(0 14px 26px rgba(0,0,0,0.4));
    transition:opacity 2s ease, transform 2s ease;
    opacity:0;
    transform:scale(0.88);
  }
  #garden.bloom{
    opacity:1;
    transform:scale(1);
  }
  #garden.fade-out{ opacity:0; pointer-events:none; }

  .flower-visual{
    position:absolute;
    left:0; top:0;
    width:100%;
    height:var(--flowerSize);
  }

  .ring{
    position:absolute;
  }
  #outerRing{ inset:0; }
  #innerRing{ left:18%; top:18%; width:64%; height:64%; pointer-events:none; }

  .petal-wrap{
    position:absolute;
    left:0; top:0;
    width:100%; height:100%;
    display:flex; align-items:flex-start; justify-content:center;
    transform-origin:50% 50%;
    pointer-events:none;
    touch-action:manipulation;
  }
  .petal-wrap svg{
    overflow:visible;
    transition:transform .85s cubic-bezier(.5,-0.3,.7,1), opacity .85s ease;
    pointer-events:auto;
    cursor:pointer;
  }
  #outerRing .petal-wrap svg{ width:46%; height:60%; margin-top:0%; }
  #innerRing .petal-wrap svg{ width:40%; height:52%; margin-top:2%; }
  .petal-wrap.gone svg{
    transform:translateY(130px) rotate(230deg) scale(0.65);
    opacity:0;
    pointer-events:none;
  }

  .core{
    position:absolute;
    left:50%; top:50%;
    width:22%; height:22%;
    transform:translate(-50%,-50%);
    z-index:5;
    pointer-events:none;
  }
  .core svg{ overflow:visible; position:absolute; }

  .stem{
    position:absolute;
    left:50%;
    top:calc(var(--flowerSize) - 6px);
    width:6px; height:60px;
    background:linear-gradient(var(--stem), #24331f);
    transform:translateX(-50%);
    border-radius:3px;
    z-index:0;
  }
  .leaf{
    position:absolute;
    width:26px; height:16px;
    background:var(--stem);
    border-radius:0% 100% 0% 100%;
    top:calc(var(--flowerSize) + 10px);
    z-index:0;
  }
  .leaf.l{ left:calc(50% - 30px); transform:rotate(20deg);}
  .leaf.r{ left:calc(50% + 6px); transform:rotate(-160deg);}

  #counter{
    margin-top:2vh;
    font-size:0.8rem;
    letter-spacing:0.08em;
    color:rgba(247,236,226,0.5);
    transition:opacity .8s ease;
  }
  #counter.fade-out{ opacity:0; pointer-events:none; }

  /* Question screen */
  #question{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 8vw;
    opacity:0; pointer-events:none;
    transition:opacity 1.3s ease;
    background:
      radial-gradient(ellipse at 50% 32%, rgba(217,163,95,0.16) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 15%, var(--bg-2) 0%, var(--bg-1) 70%);
    z-index:80;
    overflow:hidden;
  }
  #question.show{ opacity:1; pointer-events:auto; }
  #question.show .qmark{ animation: qpop 1.1s cubic-bezier(.34,1.56,.64,1) .2s both; }
  #question.show .qframe{ animation: frameIn 1.2s ease .1s both; }
  #question.show .qname{ animation: fadeUp 1s ease .55s both; }
  #question.show .qtext{ animation: fadeUp 1s ease .8s both; }
  #question.show .qline{ animation: lineGrow 1s ease .95s both; }
  #question.show .btn-row{ animation: fadeUp 1s ease 1.1s both; }

  @keyframes frameIn{
    0%{ opacity:0; transform:scale(0.85); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes qpop{
    0%{ opacity:0; transform:translateY(10px) scale(0.7) rotate(-8deg); }
    60%{ opacity:1; transform:translateY(-4px) scale(1.15) rotate(4deg); }
    100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes fadeUp{
    0%{ opacity:0; transform:translateY(14px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes lineGrow{
    0%{ opacity:0; width:0; }
    100%{ opacity:1; width:56px; }
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  }
  @keyframes glowPulseOuter{
    0%,100%{ opacity:.3; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:.55; transform:translate(-50%,-50%) scale(1.08); }
  }
  @keyframes ringSpin{
    to{ transform:translate(-50%,-50%) rotate(360deg); }
  }
  @keyframes ringSpinRev{
    to{ transform:translate(-50%,-50%) rotate(-360deg); }
  }
  @keyframes qFloat{
    0%,100%{ transform:translate(0,0) rotate(var(--r0,0deg)); }
    50%{ transform:translate(var(--fx,10px), var(--fy,-14px)) rotate(var(--r1,20deg)); }
  }
  @keyframes rayRotate{
    to{ transform:translate(-50%,-50%) rotate(360deg); }
  }

  #qAmbient{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .q-floater{
    position:absolute;
    top:0; left:0;
    opacity:0.55;
    animation-name:qFloat;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .q-floater svg{ width:100%; height:100%; display:block; }

  .qrays{
    position:absolute;
    left:50%; top:36%;
    width:min(92vw, 480px); height:min(92vw, 480px);
    transform:translate(-50%,-50%);
    z-index:-1;
    opacity:0.5;
    animation: rayRotate 90s linear infinite;
    background:
      repeating-conic-gradient(from 0deg,
        rgba(217,163,95,0.09) 0deg 4deg,
        transparent 4deg 18deg);
    border-radius:50%;
    mask-image: radial-gradient(circle, black 0%, black 40%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle, black 0%, black 40%, transparent 72%);
  }

  .qframe{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    padding:5vh 7vw 4vh;
    z-index:1;
  }
  .qglow{
    position:absolute;
    left:50%; top:38%;
    width:min(78vw, 340px); height:min(78vw, 340px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(217,163,95,0.32) 0%, rgba(200,84,122,0.14) 45%, transparent 70%);
    filter:blur(6px);
    z-index:-1;
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  .qglowOuter{
    position:absolute;
    left:50%; top:38%;
    width:min(96vw, 420px); height:min(96vw, 420px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(217,163,95,0.18) 0%, transparent 65%);
    filter:blur(10px);
    z-index:-1;
    animation: glowPulseOuter 4.5s ease-in-out infinite;
  }
  .qring{
    position:absolute;
    left:50%; top:38%;
    width:min(64vw, 270px); height:min(64vw, 270px);
    transform:translate(-50%,-50%);
    border:1px dashed rgba(217,163,95,0.35);
    border-radius:50%;
    z-index:-1;
    animation: ringSpin 40s linear infinite;
  }
  .qring2{
    position:absolute;
    left:50%; top:38%;
    width:min(52vw, 220px); height:min(52vw, 220px);
    transform:translate(-50%,-50%);
    border:1px solid rgba(247,236,226,0.14);
    border-radius:50%;
    z-index:-1;
    animation: ringSpinRev 55s linear infinite;
  }
  .qmark{
    font-family:'Dancing Script', cursive;
    font-size:clamp(2.8rem, 12vw, 4rem);
    color:var(--gold);
    text-shadow:0 0 30px rgba(217,163,95,0.65), 0 0 60px rgba(217,163,95,0.25);
    line-height:1;
    margin-bottom:1.4vh;
  }
  .qname{
    font-family:'Dancing Script', cursive;
    font-size:clamp(1.6rem, 6.5vw, 2.2rem);
    color:var(--cream);
    letter-spacing:0.02em;
    margin:0 0 1.4vh 0;
    text-shadow:0 0 16px rgba(217,163,95,0.35);
  }
  #question p.qtext{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    color:rgba(247,236,226,0.92);
    margin:0 0 2vh 0;
    line-height:1.55;
    font-size:clamp(1.3rem, 6vw, 1.7rem);
    text-shadow:0 0 18px rgba(0,0,0,0.3);
  }
  .qline{
    width:56px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:0 0 4.5vh 0;
    opacity:0;
  }
  .btn-row{
    position:relative;
    width:100%;
    height:190px;
  }
  button{
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:1rem;
    padding:14px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  #yesBtn{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(135deg, var(--gold), #c8547a);
    color:#1a0d10;
    font-size:1.05rem;
    padding:16px 36px;
    box-shadow:0 8px 26px rgba(217,163,95,0.4), 0 0 0 rgba(217,163,95,0.5);
    z-index:1;
    animation: yesPulse 2.6s ease-in-out infinite;
  }
  @keyframes yesPulse{
    0%,100%{ box-shadow:0 8px 26px rgba(217,163,95,0.4), 0 0 0 rgba(217,163,95,0.45); }
    50%{ box-shadow:0 8px 30px rgba(217,163,95,0.55), 0 0 22px rgba(217,163,95,0.35); }
  }
  #noBtn{
    background:rgba(23,11,16,0.35);
    color:rgba(247,236,226,0.7);
    border:1px solid rgba(247,236,226,0.35);
    position:absolute;
    left:0; top:0;
    z-index:2;
    transition:left .25s ease, top .25s ease;
  }

  /* Final screen */
  #final{
    position:fixed; inset:0;
    background:#fdf6f1;
    text-align:center; padding:4vh 8vw;
    opacity:0; pointer-events:none;
    transition:opacity 1.6s ease;
    z-index:200;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #final.show{ opacity:1; pointer-events:auto; }

  #petalRain{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .falling-petal{
    position:absolute;
    top:-40px;
    opacity:0.9;
    animation-name:petalFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  .falling-petal svg{ width:100%; height:100%; display:block; }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0deg); }
    100%{ transform:translate(var(--drift,0px), 115vh) rotate(var(--spin,360deg)); }
  }

  #finalContent{
    position:relative;
    z-index:2;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    min-height:100%;
    max-width:520px;
    margin:0 auto;
  }
  .final-heart-icon{
    font-size:clamp(3rem, 14vw, 4.5rem);
    opacity:0;
    margin-bottom:0.5rem;
    filter:drop-shadow(0 4px 14px rgba(200,84,122,0.35));
  }
  .final-heart-icon.show-in{
    animation: finalLineIn 1s ease forwards;
  }
  .final-heart-icon.hide-out{
    animation: finalLineOut 0.9s ease forwards;
  }

  .final-line{
    font-family:'Dancing Script', cursive;
    font-size:clamp(1.6rem, 7vw, 2.6rem);
    color:#7a2e45;
    text-shadow:0 0 16px rgba(217,163,95,0.15);
    margin:0;
    opacity:0;
    line-height:1.35;
  }
  .final-line.show-in{
    animation:finalLineIn 1s ease forwards;
  }
  .final-line.hide-out{
    animation:finalLineOut 0.9s ease forwards;
  }
  @keyframes finalLineIn{
    0%{ opacity:0; transform:translateY(14px) scale(0.96); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes finalLineOut{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-14px) scale(0.97); }
  }

  #finalPhoto{
    width:min(74vw, 300px);
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    padding:10px 10px 34px 10px;
    box-shadow:0 18px 40px rgba(122,46,69,0.22), 0 2px 8px rgba(122,46,69,0.12);
    transform:rotate(-2.5deg) scale(0.85);
    opacity:0;
    margin:1.4rem 0;
  }
  #finalPhoto img{
    display:block;
    width:100%;
    border-radius:6px;
  }
  #finalPhoto.show-in{
    animation:photoIn 1.1s cubic-bezier(.34,1.2,.4,1) forwards;
  }
  @keyframes photoIn{
    0%{ opacity:0; transform:rotate(-2.5deg) scale(0.8) translateY(20px); }
    100%{ opacity:1; transform:rotate(-2.5deg) scale(1) translateY(0); }
  }

  .final-heart-line{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(2rem, 9vw, 2.8rem);
    color:#c8547a;
    text-shadow:0 0 20px rgba(217,163,95,0.25);
    margin:0.3rem 0 0 0;
    opacity:0;
  }
  .final-heart-line.show-in{
    animation:finalLineIn 1.2s ease forwards;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">

  <defs>
    <linearGradient id="gradOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c8547a"/>
      <stop offset="55%" stop-color="#e78aa5"/>
      <stop offset="100%" stop-color="#f8c9d6"/>
    </linearGradient>
    <linearGradient id="gradInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8f2f52"/>
      <stop offset="55%" stop-color="#bf4870"/>
      <stop offset="100%" stop-color="#e393ac"/>
    </linearGradient>
    <linearGradient id="gradCore" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5c1830"/>
      <stop offset="60%" stop-color="#8a2c4a"/>
      <stop offset="100%" stop-color="#b8496a"/>
    </linearGradient>
  </defs>
</svg>

<div id="intro">
  <div class="starfield" id="introStars"></div>
  <p id="introText"></p>
</div>

<div id="stage" class="hidden-for-intro">
  <div class="starfield" id="stageStars"></div>
  <div id="stageAmbient"></div>
  <h1 class="title">Laura,</h1>
  <p class="sub" id="caption">toca los pétalos, uno a uno…</p>

  <div id="garden">
    <div class="stem" id="stem"></div>
    <div class="leaf l" id="leafL"></div>
    <div class="leaf r" id="leafR"></div>
    <div class="flower-visual">
      <div class="ring" id="outerRing"></div>
      <div class="ring" id="innerRing"></div>
      <div class="core" id="core"></div>
    </div>
  </div>

  <div id="counter"></div>

  <div id="bigMoment">
    <div class="starfield" id="bigMomentStars"></div>
    <p id="bigText"><span class="cursor">|</span></p>
  </div>

  <div id="question">
    <div id="qAmbient"></div>
    <div class="qrays"></div>
    <div class="qframe">
      <div class="qglowOuter"></div>
      <div class="qglow"></div>
      <div class="qring2"></div>
      <div class="qring"></div>
      <div class="qmark">✿</div>
      <div class="qname">Cucujandro tiene algo que preguntarte</div>
      <p class="qtext">¿quieres ser mi novia?</p>
      <div class="qline"></div>
      <div class="btn-row">
        <button id="yesBtn">Sí, quiero</button>
        <button id="noBtn">No</button>
      </div>
    </div>
  </div>

  <div id="final">
    <div id="petalRain"></div>
    <div id="finalContent">

<script>
  const introEl = document.getElementById('intro');
  const introText = document.getElementById('introText');
  const stageEl = document.getElementById('stage');
  const gardenEl = document.getElementById('garden');

  const introLines = [
    "Hay cosas que las palabras no consiguen explicar…",
    "Por eso he querido hacer algo diferente para ti."
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function playIntro(){
    if(reduceMotion){
      introEl.remove();
      stageEl.classList.remove('hidden-for-intro');
      gardenEl.classList.add('bloom');
      return;
    }
    let i = 0;
    function showLine(){
      introText.classList.remove('in');
      // force reflow so the animation can restart
      void introText.offsetWidth;
      introText.textContent = introLines[i];
      introText.classList.add('in');
      i++;
      if(i < introLines.length){
        setTimeout(showLine, 3400);
      } else {
        setTimeout(()=>{
          introEl.classList.add('fade-out');
          stageEl.classList.remove('hidden-for-intro');
          setTimeout(()=>{ gardenEl.classList.add('bloom'); }, 200);
          setTimeout(()=>{ introEl.remove(); }, 1700);
        }, 3400);
      }
    }
    showLine();
  }
  playIntro();
</script>

<script>
  const garden = document.getElementById('garden');
  const titleEl = document.querySelector('h1.title');
  const caption = document.getElementById('caption');
  const counter = document.getElementById('counter');
  const stem = document.getElementById('stem');
  const leafL = document.getElementById('leafL');
  const leafR = document.getElementById('leafR');
  const outerRing = document.getElementById('outerRing');
  const innerRing = document.getElementById('innerRing');
  const core = document.getElementById('core');
  const question = document.getElementById('question');
  const finalScreen = document.getElementById('final');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const bigMoment = document.getElementById('bigMoment');
  const bigText = document.getElementById('bigText');

  // ambient sparkles - varios tamaños para dar sensación de profundidad/distancia
  for(let i=0;i<16;i++){
    const s = document.createElement('div');
    s.className='sparkle';
    const tier = Math.random();
    const size = tier < 0.5 ? (1.5+Math.random()*1.5) : tier < 0.85 ? (3+Math.random()*2) : (5+Math.random()*2.5);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDuration = (3 + Math.random()*3)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    document.getElementById('stage').appendChild(s);
  }

  // campo de estrellas lejanas, muy tenues, para las pantallas oscuras
  function spawnStarfield(id, count){
    const container = document.getElementById(id);
    if(!container || reduceMotion) return;
    for(let i=0;i<count;i++){
      const st = document.createElement('div');
      st.className = 'star';
      const size = 1 + Math.random()*1.6;
      st.style.width = size+'px';
      st.style.height = size+'px';
      st.style.left = Math.random()*100+'%';
      st.style.top = Math.random()*100+'%';
      const minO = (0.08 + Math.random()*0.12).toFixed(2);
      const maxO = (0.3 + Math.random()*0.35).toFixed(2);
      st.style.setProperty('--minO', minO);
      st.style.setProperty('--maxO', maxO);
      st.style.animationDuration = (5 + Math.random()*7)+'s';
      st.style.animationDelay = (-Math.random()*10)+'s';
      container.appendChild(st);
    }
  }
  spawnStarfield('introStars', 50);
  spawnStarfield('stageStars', 45);
  spawnStarfield('bigMomentStars', 50);

  // symmetric curved petal, tip up (y=0), base down (y=140)
  const PETAL_D = "M50,140 C18,112 10,55 50,4 C90,55 82,112 50,140 Z";
  function petalSVG(gradId){
    return `<svg viewBox="0 0 100 140"><path d="${PETAL_D}" fill="url(#${gradId})"/></svg>`;
  }

  // un par de pétalos flotando muy despacio y sutiles en la pantalla de la flor
  (function spawnStageFloaters(){
    const container = document.getElementById('stageAmbient');
    if(!container || reduceMotion) return;
    const grads = ['gradOuter','gradInner'];
    // zonas fijas repartidas por el borde de la pantalla, para que nunca queden alineados
    const zones = [
      {x:[6,20],  y:[8,26]},
      {x:[78,94], y:[10,26]},
      {x:[3,16],  y:[52,72]},
      {x:[82,96], y:[48,68]},
      {x:[68,86], y:[80,92]}
    ];
    zones.forEach((zone, i) => {
      const el = document.createElement('div');
      el.className = 'stage-floater';
      const size = 16 + Math.random()*16;
      el.style.width = size+'px';
      el.style.height = (size*1.4)+'px';
      el.style.left = (zone.x[0] + Math.random()*(zone.x[1]-zone.x[0]))+'%';
      el.style.top = (zone.y[0] + Math.random()*(zone.y[1]-zone.y[0]))+'%';
      const dur = 8 + Math.random()*5;
      el.style.animationDuration = dur+'s';
      el.style.animationDelay = (-Math.random()*dur)+'s';
      el.style.setProperty('--fx', (Math.random()*34-17)+'px');
      el.style.setProperty('--fy', (Math.random()*34-20)+'px');
      el.style.setProperty('--r0', (Math.random()*24-12)+'deg');
      el.style.setProperty('--r1', (Math.random()*24-12)+'deg');
      el.innerHTML = petalSVG(grads[i % grads.length]);
      container.appendChild(el);
    });
  })();

  // static furled core (bud) sitting on top, never falls
  [-18, 0, 20].forEach((rot, idx) => {
    const wrap = document.createElement('div');
    wrap.style.position='absolute';
    wrap.style.left='50%'; wrap.style.top='50%';
    wrap.style.width='70%'; wrap.style.height='70%';
    wrap.style.transform=`translate(-50%,-60%) rotate(${rot}deg)`;
    wrap.style.transformOrigin='50% 85%';
    wrap.innerHTML = petalSVG('gradCore');
    wrap.querySelector('svg').style.width='100%';
    wrap.querySelector('svg').style.height='100%';
    wrap.style.zIndex = idx;
    core.appendChild(wrap);
  });

  const phrases = [
    "cada pétalo que cae es un instante que quiero vivir contigo",
    "para mi Lauraá, la que le cambió el color a mis días",
    "Cucujandro sonríe solo con pensarte",
    "hay cosas que no te he dicho, y este jardín las guarda todas",
    "contigo hasta lo pequeño se vuelve bonito",
    "esto lo hice pensando solo en ti, despacio, con cariño",
    "un pétalo menos, un motivo más para quererte",
    "ya casi, Lauraá… el corazón no deja de latir",
    "no queda nada… solo tú y lo que viene ahora",
    "el último pétalo cae, y contigo empieza todo"
  ];

  const OUTER_COUNT = 8;
  const INNER_COUNT = 6;
  const TOTAL = OUTER_COUNT;
  let remaining = TOTAL;
  let tapIndex = 0;

  function buildRing(container, count, offset, gradId, interactive){
    for(let i=0;i<count;i++){
      const jitter = (Math.random()*8-4);
      const angle = (360/count)*i + offset + jitter;
      const wrap = document.createElement('div');
      wrap.className = 'petal-wrap';
      wrap.style.transform = `rotate(${angle}deg)`;
      wrap.innerHTML = petalSVG(gradId);
      if(interactive){
        wrap.addEventListener('click', () => onPetalTap(wrap), {once:true});
      }
      container.appendChild(wrap);
    }
  }
  buildRing(innerRing, INNER_COUNT, 36, 'gradInner', false);
  buildRing(outerRing, OUTER_COUNT, 0, 'gradOuter', true);

  updateCounter();

  // ---- sonidos suaves, sintetizados (sin archivos externos) ----
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }
  function tone(ctx, freq, startTime, duration, type, peakGain){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }
  function playPop(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t = ctx.currentTime;
    const duration = 0.5;

    // ráfaga de ruido breve para simular el soplo de aire
    const bufferSize = Math.ceil(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2 - 1);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    // filtro paso-banda que se mueve, para que suene a "whoosh" de viento y no a estática
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.setValueAtTime(0.8, t);
    filter.frequency.setValueAtTime(500, t);
    filter.frequency.linearRampToValueAtTime(1800, t + 0.16);
    filter.frequency.exponentialRampToValueAtTime(300, t + duration);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.18, t + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t);
    noise.stop(t + duration + 0.05);
  }
  function playSparkle(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t = ctx.currentTime;
    [1046.5, 1318.5, 1568].forEach((f, i)=>{
      tone(ctx, f, t + i*0.08, 0.55, 'sine', 0.045);
    });
  }
  function playYesChime(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((f, i)=>{
      tone(ctx, f, t + i*0.07, 1.5, 'sine', 0.08);
    });
    tone(ctx, 1046.5, t + 0.55, 1.1, 'sine', 0.045);
  }

  function updateCounter(){
    counter.textContent = remaining > 0
      ? `${remaining} pétalo${remaining===1?'':'s'} por caer`
      : '';
  }

  const bigLines = [
    "Laura...",
    "Hay una pregunta...",
    "que llevo mucho tiempo queriendo hacerte...",
    "Y entonces..."
  ];

  function typeLines(el, lines, onDone){
    const charDelay = 55;
    const linePause = 950;
    let li = 0;
    function typeLine(){
      const line = lines[li];
      let ci = 0;
      function typeChar(){
        el.innerHTML = line.slice(0, ci) + '<span class="cursor">|</span>';
        if(ci <= line.length){
          ci++;
          setTimeout(typeChar, charDelay);
        } else {
          li++;
          if(li < lines.length){
            setTimeout(()=>{
              el.innerHTML = '<span class="cursor">|</span>';
              setTimeout(typeLine, 350);
            }, linePause);
          } else {
            setTimeout(onDone, linePause);
          }
        }
      }
      typeChar();
    }
    typeLine();
  }

  // Robust caption crossfade: instead of trusting a fixed setTimeout to
  // line up with the CSS transition duration, we wait for the real
  // 'transitionend' event before swapping the text. On mobile, with dozens
  // of petal SVGs animating at once, the device can be too busy to finish
  // the opacity fade exactly on the JS clock's schedule — a fixed timeout
  // then swaps the text too early, so the old phrase is still visible when
  // the new one appears, showing both stacked for a moment. Listening for
  // transitionend (with a safety-timeout fallback in case it never fires)
  // ties the swap to what's actually on screen instead of to a guessed time.
  let captionFallback = null;
  let captionHandler = null;

  function clearCaptionWait(){
    if(captionHandler){ caption.removeEventListener('transitionend', captionHandler); captionHandler = null; }
    if(captionFallback){ clearTimeout(captionFallback); captionFallback = null; }
  }

  function setCaptionText(text){
    caption.textContent = text;
    // Force a reflow before fading back in so the browser always
    // registers the opacity change as a fresh transition.
    void caption.offsetWidth;
    caption.style.opacity = 1;
  }

  function fadeCaptionTo(text){
    clearCaptionWait();

    // Already invisible (e.g. very first call) — just swap immediately.
    if(getComputedStyle(caption).opacity === '0'){
      setCaptionText(text);
      return;
    }

    caption.style.opacity = 0;
    let done = false;
    captionHandler = (e)=>{
      if(e.target !== caption || e.propertyName !== 'opacity' || done) return;
      done = true;
      clearCaptionWait();
      setCaptionText(text);
    };
    caption.addEventListener('transitionend', captionHandler);
    // Safety net: if transitionend never fires (backgrounded tab, unusual
    // browser behavior, etc.) swap anyway after a generous margin so the
    // caption never gets stuck blank.
    captionFallback = setTimeout(()=>{
      if(done) return;
      done = true;
      captionHandler = null;
      setCaptionText(text);
    }, 650);
  }

  function onPetalTap(wrap){
    wrap.classList.add('gone');
    playPop();
    remaining--;
    const phrase = phrases[tapIndex % phrases.length];
    tapIndex++;

    fadeCaptionTo(phrase);
    updateCounter();

    if(remaining === 0){
      // Let the last phrase's normal fade-in finish, then fade it out
      // together with the garden so it never lingers on screen during
      // the transition.
      setTimeout(()=>{
        clearCaptionWait();
        caption.style.opacity = 0;
        setTimeout(()=>{ caption.textContent = ''; }, 400);
      }, 1000);

      setTimeout(()=>{
        garden.classList.add('fade-out');
        counter.classList.add('fade-out');
        titleEl.classList.add('fade-out');
      }, 1000);

      setTimeout(()=>{
        bigMoment.classList.add('show');
        typeLines(bigText, bigLines, ()=>{
          bigMoment.classList.add('fade-out');
          setTimeout(()=>{
            question.classList.add('show');
            spawnQuestionAmbient();
            playSparkle();
          }, 900);
          setTimeout(()=>{
            bigMoment.classList.remove('show');
          }, 1500);
        });
      }, 2200);
    }
  }

  // "No" button starts right next to "Sí", and only escapes once you try to touch it
  function rectsOverlap(x1,y1,w1,h1,x2,y2,w2,h2){
    return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
  }
  function placeInitial(){
    const row = noBtn.parentElement.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();
    const btnW = noBtn.offsetWidth || 70;
    const btnH = noBtn.offsetHeight || 44;
    const yesLeft = yesRect.left - row.left;
    const yesTop = yesRect.top - row.top;
    let x = yesLeft + yesRect.width + 16;
    let y = yesTop + (yesRect.height - btnH)/2;
    if(x + btnW > row.width){
      x = yesLeft + (yesRect.width - btnW)/2;
      y = yesTop + yesRect.height + 16;
    }
    noBtn.style.left = Math.max(0, x) + 'px';
    noBtn.style.top = Math.max(0, y) + 'px';
  }
  function dodge(){
    const row = noBtn.parentElement.getBoundingClientRect();
    const btnW = noBtn.offsetWidth || 80;
    const btnH = noBtn.offsetHeight || 44;
    const yesRect = yesBtn.getBoundingClientRect();
    const yesX = yesRect.left - row.left - 24;
    const yesY = yesRect.top - row.top - 24;
    const yesW = yesRect.width + 48;
    const yesH = yesRect.height + 48;
    const maxX = Math.max(0, row.width - btnW);
    const maxY = Math.max(0, row.height - btnH);

    let x, y, tries = 0;
    do{
      x = Math.random()*maxX;
      y = Math.random()*maxY;
      tries++;
    } while(tries < 25 && rectsOverlap(x,y,btnW,btnH, yesX,yesY,yesW,yesH));

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }
  noBtn.addEventListener('pointerenter', dodge);
  noBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); dodge(); });
  noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
  noBtn.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });

  window.addEventListener('load', placeInitial);
  setTimeout(placeInitial, 50);

  yesBtn.addEventListener('click', () => {
    playYesChime();
    question.classList.remove('show');
    setTimeout(()=>{
      finalScreen.classList.add('show');
      startPetalRain();
      playFinalSequence();
    }, 700);
  });

  function startPetalRain(){
    const container = document.getElementById('petalRain');
    const petalCount = reduceMotion ? 0 : 55;
    for(let i=0;i<petalCount;i++){
      spawnFallingPetal(container);
    }
  }

  function spawnFallingPetal(container){
    const el = document.createElement('div');
    el.className = 'falling-petal';
    const size = 14 + Math.random()*22;
    el.style.width = size+'px';
    el.style.height = (size*1.4)+'px';
    el.style.left = Math.random()*100+'%';
    const duration = 6 + Math.random()*6;
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = (-Math.random()*duration)+'s';
    el.style.setProperty('--drift', (Math.random()*160-80)+'px');
    el.style.setProperty('--spin', (Math.random()*540+180)+'deg');
    el.style.opacity = (0.55 + Math.random()*0.4).toFixed(2);
    el.innerHTML = petalSVG('gradOuter');
    container.appendChild(el);
  }

  let questionAmbientSpawned = false;
  function spawnQuestionAmbient(){
    if(questionAmbientSpawned) return;
    questionAmbientSpawned = true;
    const container = document.getElementById('qAmbient');
    if(!container) return;
    const count = reduceMotion ? 0 : 16;
    const grads = ['gradOuter','gradInner'];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'q-floater';
      const size = 10 + Math.random()*16;
      el.style.width = size+'px';
      el.style.height = (size*1.4)+'px';
      el.style.left = Math.random()*100+'%';
      el.style.top = Math.random()*100+'%';
      const dur = 7 + Math.random()*6;
      el.style.animationDuration = dur+'s';
      el.style.animationDelay = (-Math.random()*dur)+'s';
      el.style.setProperty('--fx', (Math.random()*40-20)+'px');
      el.style.setProperty('--fy', (Math.random()*40-24)+'px');
      el.style.setProperty('--r0', (Math.random()*30-15)+'deg');
      el.style.setProperty('--r1', (Math.random()*30-15)+'deg');
      el.style.opacity = (0.3 + Math.random()*0.35).toFixed(2);
      el.innerHTML = petalSVG(grads[i % grads.length]);
      container.appendChild(el);
    }
  }

  function playFinalSequence(){
    const heartIcon = document.getElementById('finalHeartIcon');
    const lineEl = document.getElementById('finalLine');
    const photoEl = document.getElementById('finalPhoto');
    const heartLineEl = document.getElementById('finalHeartLine');
    const lines = [
      'Gracias.',
      'No sabes lo feliz que me haces.',
      'Prometo seguir cuidándote,<br>hacerte reír,<br>y estar contigo<br>en los buenos y malos momentos.'
    ];
    let i = 0;

    function showLine(){
      lineEl.innerHTML = lines[i];
      lineEl.classList.remove('hide-out');
      void lineEl.offsetWidth;
      lineEl.classList.add('show-in');
      const holdTime = i === lines.length-1 ? 2600 : 1500;
      setTimeout(()=>{
        lineEl.classList.remove('show-in');
        lineEl.classList.add('hide-out');
        setTimeout(()=>{
          i++;
          if(i < lines.length){
            showLine();
          } else {
            setTimeout(()=>{
              lineEl.style.display = 'none';
              photoEl.classList.add('show-in');
              setTimeout(()=>{
                heartLineEl.classList.add('show-in');
              }, 900);
            }, 300);
          }
        }, 900);
      }, holdTime);
    }

    heartIcon.classList.add('show-in');
    setTimeout(()=>{
      heartIcon.classList.remove('show-in');
      heartIcon.classList.add('hide-out');
      setTimeout(()=>{
        heartIcon.style.display = 'none';
        showLine();
      }, 900);
    }, 1300);
  }
</script>
